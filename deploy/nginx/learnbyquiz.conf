server {
    listen 80;
    listen [::]:80;
    server_name learnbyquiz.spiritedrobot.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://learnbyquiz.spiritedrobot.in$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name learnbyquiz.spiritedrobot.in;

    ssl_certificate /etc/letsencrypt/live/learnbyquiz.spiritedrobot.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learnbyquiz.spiritedrobot.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LearnByQuizTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/learnbyquiz.access.log;
    error_log /var/log/nginx/learnbyquiz.error.log warn;
    client_max_body_size 32k;
    client_body_timeout 15s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite client forwarding headers at this public ingress.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    proxy_next_upstream off;
    proxy_cache off;

    location /api/ {
        proxy_pass http://127.0.0.1:13001;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location / {
        # Express serves the built assets and SPA fallback, preserving routes.
        proxy_pass http://127.0.0.1:13001;
    }
}
