# Bootstrap only: enable before requesting the first certificate.
# Reuse the existing Nginx listeners; this is not a default server.
server {
    listen 80;
    listen [::]:80;
    server_name learnbyquiz.spiritedrobot.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
