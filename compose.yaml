name: learnbyquiz
services:
  app:
    image: ${APP_IMAGE:-learnbyquiz:local}
    build:
      context: .
      args:
        VITE_API_KEY: ${VITE_API_KEY:?Set public Firebase build configuration}
        VITE_AUTH_DOMAIN: ${VITE_AUTH_DOMAIN:?Set Firebase auth domain}
        VITE_PROJECT_ID: ${VITE_PROJECT_ID:?Set Firebase project ID}
        VITE_STORAGE_BUCKET: ${VITE_STORAGE_BUCKET:-}
        VITE_MESSAGING_SENDER_ID: ${VITE_MESSAGING_SENDER_ID:-}
        VITE_APP_ID: ${VITE_APP_ID:?Set Firebase app ID}
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY: "172.30.0.2"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set server Firebase project}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
      GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_QUOTA_PROJECT:-}
      QLOO_API_KEY: ${QLOO_API_KEY:?Set Qloo key}
      QLOO_BASE_URL: ${QLOO_BASE_URL:-https://hackathon.api.qloo.com}
      LLM_PROVIDER: ${LLM_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    secrets:
      - firebase_admin
    init: true
    restart: unless-stopped
    stop_grace_period: 250s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    stop_grace_period: 250s
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set the public domain without https://}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      backend:
        ipv4_address: 172.30.0.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  firebase_admin:
    file: ${GOOGLE_APPLICATION_CREDENTIALS:?Set the host credential file path}
volumes:
  caddy_data:
  caddy_config:
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
