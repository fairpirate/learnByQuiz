name: learnbyquiz
services:
  app:
    image: ${APP_IMAGE:-learnbyquiz:local}
    build:
      context: .
      args:
        VITE_API_KEY: ${VITE_API_KEY:?Set public Firebase build configuration}
        VITE_AUTH_DOMAIN: ${VITE_AUTH_DOMAIN:?Set Firebase auth domain}
        VITE_PROJECT_ID: ${VITE_PROJECT_ID:?Set Firebase project ID}
        VITE_STORAGE_BUCKET: ${VITE_STORAGE_BUCKET:-}
        VITE_MESSAGING_SENDER_ID: ${VITE_MESSAGING_SENDER_ID:-}
        VITE_APP_ID: ${VITE_APP_ID:?Set Firebase app ID}
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Host Nginx reaches the container through this dedicated bridge gateway.
      TRUST_PROXY: "172.30.0.1"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set server Firebase project}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_admin
      GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_QUOTA_PROJECT:-}
      QLOO_API_KEY: ${QLOO_API_KEY:?Set Qloo key}
      QLOO_BASE_URL: ${QLOO_BASE_URL:-https://hackathon.api.qloo.com}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3.5-super-vl-120b-a12b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    secrets:
      - firebase_admin
    init: true
    restart: unless-stopped
    stop_grace_period: 250s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 128
    networks:
      - backend
    ports:
      - "127.0.0.1:13001:3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  firebase_admin:
    file: ${GOOGLE_APPLICATION_CREDENTIALS:?Set the host credential file path}
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
